<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b0122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Horarios</title>
<style>
:root{--red:#b0122b;--red2:#8a0d21;--bg:#f4f1ee;--card:#fff;--ink:#1d1b1a;--mute:#6b6561;--line:#ebe5e0;--line2:#d3cbc4;--soft:#fbe9ec;--rh:26px;--lw:40px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141213;--card:#1f1c1d;--ink:#f1ece8;--mute:#a69f9a;--line:#2a2526;--line2:#3d3637;--soft:#3a1d23;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
#app{min-height:100dvh;display:flex;flex-direction:column}
#app.ed{height:100dvh;overflow:hidden}
.top{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;display:flex;align-items:center;gap:2px;min-height:58px;flex:none}
.top h1{font-size:19px;margin:0 6px;flex:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex:none;cursor:pointer}
.ib:active{background:rgba(127,127,127,.2)}.ib:disabled{opacity:.35}
.ib svg{width:24px;height:24px}
.main{padding:18px 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto;flex:1}
.btn{min-height:48px;border:0;border-radius:14px;padding:0 18px;font-weight:600;background:var(--red);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--red2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.warn{background:transparent;color:#d23a3a;border:1px solid currentColor}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
h2{font-size:22px;margin:4px 0 14px;line-height:1.2}
.mute{color:var(--mute)}.small{font-size:14px}
:focus-visible{outline:3px solid #4b8df8;outline-offset:2px}

/* Home */
.hero{background:var(--red);color:#fff;margin:-18px -16px 18px;padding:6px 20px 26px}
.hero p{margin:0;opacity:.85}
.big{display:grid;gap:14px}
.bigc{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;cursor:pointer;width:100%}
.bigc:active{transform:scale(.99)}
.bigc .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--red);flex:none}
.bigc .ic svg{width:28px;height:28px}
.bigc b{font-size:19px;display:block}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.links .btn{min-height:44px;font-size:14px;font-weight:500}

/* Lists */
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px 14px}
.row .grow{flex:1;cursor:pointer;padding:4px 0}
.row b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi{color:var(--red);flex:none}.fi svg{width:30px;height:30px}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}
.empty .btn{margin-top:14px}

/* Crear */
.sems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sem{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;text-align:left;min-height:96px}
.sem b{font-size:28px;color:var(--red);display:block;line-height:1}
.sem span{font-size:12px;color:var(--mute);display:block;margin-top:6px;line-height:1.3}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 14px;font-size:16px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;min-height:52px}
.opt input{width:20px;height:20px;accent-color:var(--red);flex:none}
.opt.on{border-color:var(--red);background:var(--soft)}
.newf{display:flex;gap:8px}

/* Editor */
.ebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;font-size:13px;color:var(--mute);background:var(--card);border-bottom:1px solid var(--line);flex:none}
.ebar .clash{color:#d23a3a;font-weight:600}
.sw{display:flex;align-items:center;gap:6px;min-height:34px;cursor:pointer}
.sw input{accent-color:var(--red);width:18px;height:18px}
.gs{flex:1;overflow:auto;position:relative;background:var(--card);overscroll-behavior:contain}
.gh{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:var(--lw) repeat(var(--nd),minmax(0,1fr));background:var(--card);border-bottom:1px solid var(--line2)}
.gh div{text-align:center;font-size:13px;font-weight:650;padding:7px 0}
.gb{display:grid;grid-template-columns:var(--lw) repeat(var(--nd),minmax(0,1fr));padding-bottom:12px}
.tl{position:relative}
.tl span{position:absolute;right:5px;font-size:11px;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tl span:first-child{transform:none}
.col{position:relative;border-left:1px solid var(--line);
 background:
  repeating-linear-gradient(to bottom,transparent 0 calc(var(--rh)*2 - 1px),var(--line2) calc(var(--rh)*2 - 1px) calc(var(--rh)*2)),
  repeating-linear-gradient(to bottom,transparent 0 calc(var(--rh) - 1px),var(--line) calc(var(--rh) - 1px) var(--rh))}
.col.arm{background-color:rgba(176,18,43,.04)}
.blk,.pv{position:absolute;border-radius:7px;padding:3px 4px;overflow:hidden;font-size:11px;line-height:1.15;user-select:none;-webkit-user-select:none}
.blk{touch-action:none;cursor:grab;z-index:1}
.blk.kT{background:var(--c);color:#fff}
.blk.kE{background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--ink);border-left:4px solid var(--c)}
.blk.kL{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--card)) 0 6px,color-mix(in srgb,var(--c) 14%,var(--card)) 6px 12px);color:var(--ink);border:2px solid var(--c)}
.blk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:650;hyphens:auto;overflow-wrap:anywhere}
.blk small{display:block;font-size:10px;opacity:.9;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.clash{outline:2px dashed #e53935;outline-offset:-2px}
.blk.lift{opacity:.3}
.rhd{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.rhd::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:currentColor;opacity:.55}
.pv{left:2px;right:2px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);z-index:2;pointer-events:none;color:var(--ink);font-weight:650}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;padding:8px 12px;border-radius:12px;background:var(--c);color:#fff;font-size:13px;font-weight:650;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:180px}
.trayw{flex:none;position:relative;background:var(--bg);border-top:1px solid var(--line2);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.trayw.hid{padding:0 0 env(safe-area-inset-bottom)}.trayw.hid .hint,.trayw.hid .tray{display:none}
.ttab{position:absolute;right:12px;bottom:100%;margin-bottom:-1px;z-index:4;display:flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border:1px solid var(--line2);border-bottom:0;border-radius:12px 12px 0 0;background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.ttab svg{width:18px;height:18px;transition:transform .2s}.trayw.hid .ttab{background:var(--red);color:#fff;border-color:var(--red)}.trayw.hid .ttab svg{transform:rotate(180deg)}
.blk small+small{opacity:.75}
.hint{font-size:12px;color:var(--mute);padding:0 12px 6px;min-height:18px}
.hint.arm{color:var(--red);font-weight:600}
.tray{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:7px;min-height:44px;padding:4px 12px 4px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line2);touch-action:pan-x;user-select:none;-webkit-user-select:none;cursor:grab;max-width:210px}
.chip i{width:8px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.chip.kE i{background:color-mix(in srgb,var(--c) 40%,var(--card));border:2px solid var(--c)}
.chip.kL i{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px);border:1px solid var(--c)}
.chip span{font-size:13px;line-height:1.15;overflow:hidden}
.chip span b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.chip span em{font-style:normal;color:var(--mute);font-size:11px}
.chip.on{border:2px solid var(--red);background:var(--soft)}
.chip.add{background:var(--red);color:#fff;border:0;font-weight:600;padding:4px 14px;cursor:pointer}
.chip.add svg{width:20px;height:20px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .acts{display:grid;gap:8px;margin-top:16px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;background:transparent;border-radius:12px;padding:0 10px;text-align:left;cursor:pointer;font-size:16px}
.menu button:active{background:var(--line)}
.menu button svg{width:22px;height:22px;color:var(--mute)}
.menu button.del{color:#d23a3a}.menu button.del svg{color:#d23a3a}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.step .btn{width:48px;padding:0;font-size:22px}
.selr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.sg{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
details.sg summary{padding:12px 14px;font-weight:650;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between}
details.sg .opt{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
.tag{font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.cust{display:grid;gap:8px;border:1px dashed var(--line2);border-radius:14px;padding:12px;margin-top:6px}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;min-height:40px}
.chk input{accent-color:var(--red);width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;text-align:center;animation:fade .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (min-width:700px){:root{--rh:30px;--lw:52px}.blk{font-size:12px}.blk small{font-size:11px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script>
{
/* ---------- Malla (Ing. en Ciencias de la Computación) ---------- */
// [código, nombre, extras ('E' ejercicios, 'L' laboratorio), créditos]
const MALLA = {
 1:[['MAT 1401','Álgebra Lineal 1','E',3],['MAT 1201','Cálculo Diferencial','E',3],['CMP 1001','Taller de Ing. Cs. Computación','',3],['ESP 1001','Escritura Académica','',3],['ECN 1001','Introducción a la Economía','',3],['ESL 0001','Inglés Nivel 1','',0],['ESL 0002','Inglés Nivel 2','',0]],
 2:[['MAT 1202','Cálculo Integral','E',3],['CMP 1101','Programación en C++','E',3],['ARL 1001','Autoconocimiento','',3],['ARL 1002','Cosmos','',3],['HUM','Humanidades (LIT/FIL/ARH/ESC)','',3],['ESL 0003','Inglés Nivel 3','',0],['ESL 0004','Inglés Nivel 4','',0]],
 3:[['FIS 2701','Física para Ing. 1','EL',3],['MAT 2203','Cálculo Vectorial','',3],['MAT 2004','Matemáticas Discretas','',3],['CMP 2102','Programación Avanzada en C++','',3],['ARL 2001','Ser y Cosmos','',3],['ESL 0005','Inglés Nivel 5','',0],['ESL 0006','Inglés Nivel 6','',0]],
 4:[['FIS 2702','Física para Ing. 2','EL',3],['MAT 2008','Probabilidad y Estadística','E',3],['CMP 2104','Prog. Asistida de Aplicaciones','',3],['DEP 0010','Deportes','',1],['PRC 2000','Aprendizaje y Servicio PASEC','',3],['ARTE','Arte (ART/MUS/DAN/TEA)','',3]],
 5:[['IEE 2001','Electrónica Básica','L',3],['CMP 3005','Teoría de la Computación','',3],['CMP 3002','Estructuras de Datos','',3],['CMP 3003','Diseño de Sistemas','',3],['CCSS','CCSS (HIS/SOC/ANT/POL/REL/PSI)','',3],['GST 0010','Cultura Gastronómica','',1]],
 6:[['CMP 4004','Inteligencia Artificial','',3],['CMP 3004','Organización de Computadores','',3],['MAC 4002','Aprendizaje Automático','',3],['OPT 1','Optativa 1/3','',3],['ADM 3002','Emprendimiento','',3]],
 7:[['CMP 4005','Redes','L',3],['CMP 4007','Algoritmos Avanzados','',3],['CMP 4003','Sistemas Operativos','',3],['OPT 2','Optativa 2/3','',3],['ELECTIVA 1','Electiva Libre 1/2','',3]],
 8:[['CMP 5006','Seguridad Informática','',3],['CMP 4002','Base de Datos','',3],['CMP 4008','Desarrollo de Software Moderno','',3],['OPT 3','Optativa 3/3','',3],['ELECTIVA 2','Electiva Libre 2/2','',3]],
 9:[['CMP 5002','Fund. Ciencia de Datos','',3],['CMP 5001','Aplicaciones Distribuidas','',3],['CMP 5007','Hacking Ético','',3],['CMP 5992','Proyecto Integrador CMP','',5],['ING 0001','Coloquios','',1]]
};
const COLORS=['#d64545','#2f7fd1','#e08a1e','#2e9e6a','#8a55c9','#d14b8f','#1f9aa8','#b98a12','#5767d6','#c2562b','#4c9a2a','#7a5c48'];
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYS_L=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const KIND={T:'Clase',E:'Ejercicios',L:'Laboratorio'};
const KSHORT={T:'',E:'Ej · ',L:'Lab · '};
const START=7*60, END=21*60, DEF=60;

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const app=$('#app'), layer=$('#layer');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const durTxt=d=>{const h=Math.floor(d/60),m=d%60;return (h?h+' h':'')+(h&&m?' ':'')+(m?m+' min':'')};
const RH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh'))||26;
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
 back:svg('<path d="M15 5l-7 7 7 7"/>'),plus:svg('<path d="M12 5v14M5 12h14"/>'),
 dl:svg('<path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>'),undo:svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),more:svg('<path d="M12 6h.01M12 12h.01M12 18h.01" stroke-width="3.2"/>'),
 edit:svg('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),folder:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
 share:svg('<path d="M12 3v12M7 8l5-5 5 5M5 13v6h14v-6"/>'),cal:svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3v3H8z"/>'),
 trash:svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
 move:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6m-2-2 2 2-2 2"/>'),
 rename:svg('<path d="M4 7V5h16v2M12 5v14M9 19h6"/>'),install:svg('<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v7m-3-3 3 3 3-3"/>')
};
let toastT;
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* ---------- Datos ---------- */
const KEY='horarios.v1';
let db={folders:[],schedules:[]};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.folders))db=p}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('No se pudo guardar en el teléfono')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const folderOf=id=>db.folders.find(f=>f.id===id);
const schedOf=id=>db.schedules.find(s=>s.id===id);
const inFolder=id=>db.schedules.filter(s=>s.folder===id).sort((a,b)=>b.updated-a.updated);
function newFolder(name){const f={id:uid(),name:name.trim()||'Sin nombre',created:Date.now()};db.folders.push(f);persist();return f}
function subjFromMalla(row,used){const c=COLORS.find(x=>!used.includes(x))||COLORS[used.length%COLORS.length];used.push(c);return{id:uid(),code:row[0],name:row[1],x:row[2],cr:row[3],color:c}}
function kindsOf(sub){return['T',...sub.x.split('')]}
function credits(s){return s.subjects.reduce((a,b)=>a+(+b.cr||0),0)}
function dateTxt(t){return new Date(t).toLocaleDateString('es-EC',{day:'numeric',month:'short'})}

/* ---------- Navegación (soporta botón atrás de Android) ---------- */
let route={v:'home'};
const sheets=[];
function go(v,p={},replace){route={v,...p};history[replace?'replaceState':'pushState'](route,'');render()}
addEventListener('popstate',e=>{
 if(sheets.length){const el=sheets.pop();el.remove();el._after&&el._after();return}
 route=e.state&&e.state.v?e.state:{v:'home'};render();
});
history.replaceState(route,'');

function openSheet(html,mount){
 const el=document.createElement('div');el.className='scrim';
 el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
 layer.append(el);sheets.push(el);history.pushState({...route,sheet:1},'');
 const close=after=>{if(!el.isConnected)return;el._after=after;history.back()};
 el.addEventListener('click',e=>{if(e.target===el)close()});
 mount&&mount(el.firstElementChild,close);
 return close;
}
function ask(title,value='',label='Guardar',hint=''){
 return new Promise(res=>{
  let done=false;
  openSheet(`<h3>${esc(title)}</h3>${hint?`<p class="mute small">${esc(hint)}</p>`:''}<form><input class="inp" id="askIn" value="${esc(value)}" maxlength="60" autocomplete="off"><div class="acts two"><button type="button" class="btn sec" data-x>Cancelar</button><button class="btn">${esc(label)}</button></div></form>`,(s,close)=>{
   const inp=s.querySelector('#askIn');setTimeout(()=>{inp.focus();inp.select()},120);

function layoutDay(list){

 const d=drag;stopDrag();
 if(!d.on){
  if(d.t==='new'){armed=armed&&armed.sid===d.sid&&armed.k===d.k?null:{sid:d.sid,k:d.k};renderTray()}
  else blockSheet(d.b);
  return;
 }
 if(d.t==='resize'){if(d.dur&&d.dur!==d.b.dur)commit(()=>{d.b.dur=d.dur});else renderBlocks();return}
 if(d.target){
  if(d.t==='new')commit(()=>cur.blocks.push({id:uid(),sid:d.sid,k:d.k,day:d.target.day,start:d.target.start,dur:d.target.dur,room:''}));
  else if(d.target.day!==d.b.day||d.target.start!==d.b.start)commit(()=>{d.b.day=d.target.day;d.b.start=d.target.start});
  else renderBlocks();
 }else renderBlocks();
});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid){stopDrag();renderBlocks()}});
document.addEventListener('keydown',e=>{
 if(route.v!=='editor')return;
 const chip=e.target.closest&&e.target.closest('.chip[data-s]');
 if(chip&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const s=chip.dataset.s,k=chip.dataset.k;armed=armed&&armed.sid===s&&armed.k===k?null:{sid:s,k};renderTray()}
 if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();doUndo()}
});
// Tocar una celda con un bloque "armado"
document.addEventListener('click',e=>{
 if(route.v!=='editor'||!armed)return;
 const col=e.target.closest('.col');if(!col||e.target.closest('.blk'))return;
 const c=cellAt(e.clientX,e.clientY);if(!c)return;
 const a=armed;placeAt(a.sid,a.k,c.day,c.min);
});

function blockSheet(b){
 const s=subj(b.sid);if(!s)return;
 const nd=cur.showSat?6:5;
 const times=[];for(let m=START;m<END;m+=30)times.push(m);
 openSheet(`<h3>${esc(s.name)}</h3><p class="mute small" style="margin:0 0 14px">${esc(s.code)} · ${KIND[b.k]}</p>
  <div class="selr field"><label><span class="small mute">Día</span><select class="inp" id="bd">${DAYS_L.slice(0,nd).map((d,i)=>`<option value="${i}" ${i===b.day?'selected':''}>${d}</option>`).join('')}</select></label>
  <label><span class="small mute">Inicio</span><select class="inp" id="bs">${times.map(m=>`<option value="${m}" ${m===b.start?'selected':''}>${fmt(m)}</option>`).join('')}</select></label></div>
  <div class="field"><span>Duración</span><div class="step"><button class="btn sec" id="dm" aria-label="Menos 30 minutos">−</button><b id="dv">${durTxt(b.dur)}</b><button class="btn sec" id="dp" aria-label="Más 30 minutos">+</button></div></div>
  <label class="field"><span>Profesor/a <span class="mute small">(de ${KIND[b.k].toLowerCase()} de esta materia)</span></span><input class="inp" id="bp" value="${esc(profOf(s,b.k))}" maxlength="40" placeholder="Nombre del profesor" autocomplete="off"></label>
  <label class="field"><span>Aula / NRC (opcional)</span><input class="inp" id="br" value="${esc(b.room)}" maxlength="24" placeholder="Ej.: HW-203 · NRC 1234"></label>
  <div class="acts two"><button class="btn warn" id="bx">${I.trash} Eliminar</button><button class="btn" id="bok">Listo</button></div>`,(sh,close)=>{
  const upd=()=>{sh.querySelector('#dv').textContent=durTxt(b.dur)};
  sh.querySelector('#bd').onchange=e=>commit(()=>{b.day=+e.target.value});
  sh.querySelector('#bs').onchange=e=>commit(()=>{b.start=+e.target.value;b.dur=Math.min(b.dur,END-b.start);upd()});
  sh.querySelector('#dm').onclick=()=>{if(b.dur>30){commit(()=>{b.dur-=30});upd()}};
  sh.querySelector('#dp').onclick=()=>{if(b.start+b.dur<END){commit(()=>{b.dur+=30});upd()}};
  sh.querySelector('#br').onchange=e=>commit(()=>{b.room=e.target.value.trim()});
  const setProf=v=>{if(v!==profOf(s,b.k))commit(()=>{s.prof={...(s.prof||{}),[b.k]:v}})};
  sh.querySelector('#bp').onchange=e=>setProf(e.target.value.trim());
  sh.querySelector('#bx').onclick=()=>close(()=>commit(()=>{cur.blocks=cur.blocks.filter(x=>x!==b)}));
  sh.querySelector('#bok').onclick=()=>{setProf(sh.querySelector('#bp').value.trim());const r=sh.querySelector('#br');if(r.value.trim()!==b.room)commit(()=>{b.room=r.value.trim()});close()};
 });
}

function subjectsSheet(){
 const inSched=code=>cur.subjects.find(x=>x.code===code&&!x.custom);
 const order=[cur.sem,...Object.keys(MALLA).map(Number).filter(n=>n!==cur.sem)];
 const custom=cur.subjects.filter(x=>x.custom);
 openSheet(`<h3>Materias del horario</h3><p class="mute small" style="margin:0 0 12px">Marca o desmarca. Al quitar una materia también se quitan sus bloques (puedes deshacer).</p>
  ${order.map(n=>`<details class="sg" ${n===cur.sem?'open':''}><summary>Semestre ${n}<span class="mute small">${MALLA[n].filter(r=>inSched(r[0])).length}/${MALLA[n].length}</span></summary>
   ${MALLA[n].map(r=>`<label class="opt"><input type="checkbox" data-code="${esc(r[0])}" data-sem="${n}" ${inSched(r[0])?'checked':''}><span style="flex:1">${esc(r[1])} <span class="mute small">${esc(r[0])}</span></span>${r[2].includes('E')?'<span class="tag">+Ej</span>':''}${r[2].includes('L')?'<span class="tag">+Lab</span>':''}</label>`).join('')}</details>`).join('')}
  ${custom.length?`<details class="sg" open><summary>Personalizadas</summary>${custom.map(c=>`<label class="opt"><input type="checkbox" data-cid="${c.id}" checked><span style="flex:1">${esc(c.name)} <span class="mute small">${esc(c.code)}</span></span></label>`).join('')}</details>`:''}
  <form class="cust"><b>Agregar materia personalizada</b><input class="inp" id="cn" placeholder="Nombre (ej.: Ser Dragón)" maxlength="40"><input class="inp" id="cc" placeholder="Código (opcional)" maxlength="14">
   <div class="chk"><label><input type="checkbox" id="ce"> Ejercicios</label><label><input type="checkbox" id="cl"> Laboratorio</label><label>Créditos <input class="inp" id="ccr" type="number" min="0" max="10" value="3" style="width:72px;min-height:40px"></label></div>
   <button class="btn">${I.plus} Agregar</button></form>
  <div class="acts"><button class="btn sec" data-x>Cerrar</button></div>`,(sh,close)=>{
  sh.querySelectorAll('input[data-code]').forEach(ch=>ch.onchange=()=>{
   const code=ch.dataset.code,row=MALLA[ch.dataset.sem].find(r=>r[0]===code);
   if(ch.checked){if(!inSched(code))commit(()=>cur.subjects.push(subjFromMalla(row,cur.subjects.map(x=>x.color))))}
   else{const s=inSched(code);if(s)removeSubj(s)}
  });
  sh.querySelectorAll('input[data-cid]').forEach(ch=>ch.onchange=()=>{const s=subj(ch.dataset.cid);if(!ch.checked&&s){removeSubj(s);ch.closest('label').remove()}});
  sh.querySelector('form').onsubmit=e=>{e.preventDefault();const n=sh.querySelector('#cn').value.trim();if(!n){sh.querySelector('#cn').focus();return}
   const x=(sh.querySelector('#ce').checked?'E':'')+(sh.querySelector('#cl').checked?'L':'');
   commit(()=>{const s=subjFromMalla([sh.querySelector('#cc').value.trim()||'—',n,x,+sh.querySelector('#ccr').value||0],cur.subjects.map(y=>y.color));s.custom=true;cur.subjects.push(s)});
   close(()=>toast('«'+n+'» agregada'));};
  sh.querySelector('[data-x]').onclick=()=>close();
 });
}
function removeSubj(s){commit(()=>{cur.subjects=cur.subjects.filter(x=>x.id!==s.id);cur.blocks=cur.blocks.filter(b=>b.sid!==s.id);if(armed&&armed.sid===s.id)armed=null})}

/* ---------- Imagen PNG ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(ctx,text,maxW,maxLines){
 const words=String(text).split(/\s+/),lines=[];let line='';
 for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width<=maxW)line=t;else{if(line)lines.push(line);line=w;while(ctx.measureText(line).width>maxW&&line.length>2)line=line.slice(0,-1)}}
 if(line)lines.push(line);
 if(lines.length>maxLines){lines.length=maxLines;let l=lines[maxLines-1];while(ctx.measureText(l+'…').width>maxW&&l.length>1)l=l.slice(0,-1);lines[maxLines-1]=l+'…'}
 return lines;
}
function mix(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(v*a+255*(1-a));return`rgb(${m(r)},${m(g)},${m(b)})`}
function renderImage(s){
 const nd=s.showSat||s.blocks.some(b=>b.day===5)?6:5;
 let a=START,b=END;
 if(s.blocks.length){a=Math.floor(Math.min(...s.blocks.map(x=>x.start))/60)*60;b=Math.ceil(Math.max(...s.blocks.map(x=>x.start+x.dur))/60)*60;if(b-a<240)b=Math.min(END,a+240)}
 const used=s.subjects.filter(x=>s.blocks.some(y=>y.sid===x.id));
 const P=32,LW=64,CW=196,RH2=30,TH=92,DH=40,rows=(b-a)/30,nc=used.some(q=>q.prof&&Object.values(q.prof).some(Boolean))?1:2,legRows=Math.ceil(used.length/nc),LH=used.length?36+legRows*30:0;
 const W=P*2+LW+CW*nd,H=P*2+TH+DH+rows*RH2+LH+28,S=2;
 const c=document.createElement('canvas');c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);
 const F='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.fillStyle='#b0122b';x.fillRect(0,0,W,10);
 x.fillStyle='#1d1b1a';x.font=`700 30px ${F}`;x.textBaseline='alphabetic';x.fillText(s.name,P,P+38);
 const fold=folderOf(s.folder);
 x.fillStyle='#6b6561';x.font=`400 17px ${F}`;x.fillText(`Semestre ${s.sem} · ${s.subjects.length} materias · ${credits(s)} créditos${fold?' · '+fold.name:''}`,P,P+66);
 const gx=P+LW,gy=P+TH+DH,gh=rows*RH2;
 x.font=`700 16px ${F}`;x.textAlign='center';x.fillStyle='#1d1b1a';
 for(let d=0;d<nd;d++)x.fillText(DAYS_L[d],gx+CW*d+CW/2,gy-14);
 for(let i=0;i<=rows;i++){const yy=gy+i*RH2;x.strokeStyle=i%2?'#efeae6':'#d3cbc4';x.lineWidth=1;x.beginPath();x.moveTo(gx,yy+.5);x.lineTo(gx+CW*nd,yy+.5);x.stroke();
  if(i%2===0&&i<rows){x.fillStyle='#6b6561';x.font=`500 13px ${F}`;x.textAlign='right';x.fillText(fmt(a+i*30),gx-8,yy+5)}}
 for(let d=0;d<=nd;d++){x.strokeStyle='#e3ddd8';x.beginPath();x.moveTo(gx+CW*d+.5,gy);x.lineTo(gx+CW*d+.5,gy+gh);x.stroke()}
 x.textAlign='left';
 for(let d=0;d<nd;d++)for(const {b:bl,lane,n} of layoutDay(s.blocks.filter(q=>q.day===d))){
  const sb=s.subjects.find(q=>q.id===bl.sid);if(!sb)continue;
  const bx=gx+CW*d+3+lane*(CW-6)/n,bw=(CW-6)/n-2,by=gy+(bl.start-a)/30*RH2+2,bh=bl.dur/30*RH2-4;
  x.save();rr(x,bx,by,bw,bh,8);
  if(bl.k==='T'){x.fillStyle=sb.color;x.fill()}
  else if(bl.k==='E'){x.fillStyle=mix(sb.color,.2);x.fill();x.clip();x.fillStyle=sb.color;x.fillRect(bx,by,5,bh)}
  else{x.fillStyle=mix(sb.color,.14);x.fill();x.clip();x.strokeStyle=mix(sb.color,.32);x.lineWidth=6;for(let k=-bh;k<bw;k+=14){x.beginPath();x.moveTo(bx+k,by+bh);x.lineTo(bx+k+bh,by);x.stroke()}x.restore();x.save();rr(x,bx+1,by+1,bw-2,bh-2,7);x.strokeStyle=sb.color;x.lineWidth=2;x.stroke()}
  x.restore();
  const tc=bl.k==='T'?'#fff':'#1d1b1a',pad=bl.k==='E'?12:8,tw=bw-pad-6;
  const maxL=Math.max(1,Math.floor((bh-22)/16));
  x.fillStyle=tc;x.font=`700 14px ${F}`;
  const ls=wrap(x,sb.name,tw,Math.min(3,maxL));let ty=by+18;
  for(const l of ls){x.fillText(l,bx+pad,ty);ty+=16}
  if(bh>=40){x.font=`500 12px ${F}`;x.globalAlpha=.85;
   const sub=`${bl.k!=='T'?KIND[bl.k]+' · ':''}${fmt(bl.start)}–${fmt(bl.start+bl.dur)}`;
   x.fillText(wrap(x,sub,tw,1)[0],bx+pad,Math.min(ty+2,by+bh-6));
   let ey=ty+18;const pf=profOf(sb,bl.k);
   if(pf&&bh>=74){x.fillText(wrap(x,pf,tw,1)[0],bx+pad,Math.min(ey,by+bh-6));ey+=16}
   if(bl.room&&bh>=(pf?90:74)){x.fillText(wrap(x,bl.room,tw,1)[0],bx+pad,Math.min(ey,by+bh-6))}
   x.globalAlpha=1}
 }
 if(used.length){
  let ly=gy+gh+40;x.font=`700 15px ${F}`;x.fillStyle='#1d1b1a';x.fillText('Materias',P,ly);ly+=12;
  const colW=(W-P*2)/nc;
  used.forEach((sb,i)=>{const lx=P+(i%nc)*colW,yy=ly+Math.floor(i/nc)*30;x.fillStyle=sb.color;rr(x,lx,yy+6,14,14,3);x.fill();
   x.fillStyle='#1d1b1a';x.font=`500 14px ${F}`;const extra=sb.x?` (${sb.x.split('').map(q=>q==='E'?'+Ej':'+Lab').join(' ')})`:'';
   const pr=kindsOf(sb).filter(k=>profOf(sb,k)).map(k=>(k==='T'?'':KIND[k]+': ')+profOf(sb,k)).join(' · ');
   x.fillText(wrap(x,`${sb.code} · ${sb.name}${extra}${pr?'  —  '+pr:''}`,colW-30,1)[0],lx+22,yy+18)});
 }
 return c;
}
function fileName(s){return(s.name||'horario').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,60)+'.png'}
async function getBlob(s){const c=renderImage(s);return await new Promise(r=>c.toBlob(r,'image/png'))}
async function downloadImage(s){
 try{const blob=await getBlob(s);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName(s);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Imagen guardada en Descargas')}
 catch(e){toast('No se pudo crear la imagen')}
}
async function shareImage(s){
 try{const blob=await getBlob(s);const f=new File([blob],fileName(s),{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:s.name});else downloadImage(s)}
 catch(e){if(e&&e.name!=='AbortError')downloadImage(s)}
}

/* ---------- Copia de seguridad ---------- */
function backup(){
 const blob=new Blob([JSON.stringify({app:'mis-horarios',v:1,date:new Date().toISOString(),...db},null,1)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`horarios-respaldo-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Copia descargada');
}
$('#fileIn').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.folders)||!Array.isArray(d.schedules))throw 0;
  let nf=0,ns=0;for(const x of d.folders)if(!folderOf(x.id)){db.folders.push(x);nf++}
  for(const x of d.schedules)if(!schedOf(x.id)){db.schedules.push(x);ns++}
  persist();render();toast(`Restaurado: ${nf} carpetas y ${ns} horarios nuevos`)}
 catch(_){toast('Ese archivo no es una copia válida')}
};

/* ---------- Acciones ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id;
 switch(a){
  case'back':history.length>1&&route.v!=='home'?history.back():go('home',{},true);break;
  case'crear':go('crear');break;
  case'crear-here':go('crear',{folder:id});break;
  case'pick-sem':go('crear2',{sem:+t.dataset.k,folder:route.folder});break;
  case'horarios':go('horarios');break;
  case'open-folder':go('carpeta',{id});break;
  case'open-sched':go('editor',{id});break;
  case'folder-menu':folderMenu(id);break;
  case'sched-menu':schedMenu(id);break;
  case'dl':downloadImage(schedOf(id));break;
  case'dl-cur':downloadImage(cur);break;
  case'new-folder':{const n=await ask('Nueva carpeta','','Crear');if(n){newFolder(n);render()}}break;
  case'rename-cur':{const n=await ask('Renombrar horario',cur.name);if(n){cur.name=n;cur.updated=Date.now();persist();t.textContent=n}}break;
  case'undo':doUndo();break;
  case'subjects':subjectsSheet();break;
  case'tray':toggleTray();break;
  case'backup':backup();break;
  case'restore':$('#fileIn').click();break;
  case'install':if(installEvt){installEvt.prompt();installEvt=null;render()}break;
 }
});

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
}
